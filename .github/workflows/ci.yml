# Esteira de CI do SQA Social Media.
# Roda toda a suíte de testes automatizados sempre que um Pull Request
# para a main é aberto ou atualizado (novo push na branch do PR).
name: CI - Testes automatizados

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

# Se o PR receber um novo push, cancela a execução anterior que ainda estiver rodando
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Caixa-branca da API: testes de unidade e integração (JUnit + MockMvc + H2)
  # ---------------------------------------------------------------------------
  api-unit:
    name: API - testes de unidade/integração (JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes JUnit
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Publicar relatórios do JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-junit
          path: api/target/surefire-reports/

  # ---------------------------------------------------------------------------
  # 2) Caixa-branca do front: testes de unidade e de componente (Jest + RTL)
  # ---------------------------------------------------------------------------
  client-unit:
    name: Client - testes de unidade (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Jest
        run: npm test -- --ci

      - name: Publicar cobertura do Jest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jest
          path: client/coverage/

  # ---------------------------------------------------------------------------
  # 3) Caixa-preta: sobe banco + API + site e roda Playwright (API e E2E)
  # ---------------------------------------------------------------------------
  e2e-api:
    name: Caixa-preta - Playwright (API e E2E)
    runs-on: ubuntu-latest
    needs: [api-unit, client-unit]

    services:
      # Banco de dados MySQL usado pela API (mesmo driver do ambiente de desenvolvimento)
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sqa_social
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      API_URL: http://localhost:8080
      WEB_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            tests/package-lock.json

      # ---------- Instalação das dependências ----------
      - name: Compilar a API (Maven)
        working-directory: api
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests

      - name: Instalar dependências do client
        working-directory: client
        run: npm ci

      - name: Instalar dependências dos testes e o Chromium do Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ---------- Inicialização da aplicação ----------
      - name: Iniciar a API (porta 8080) conectada ao MySQL
        working-directory: api
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/sqa_social
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_JPA_SHOW_SQL: "false"
        run: nohup java -jar target/demo-0.0.1-SNAPSHOT.jar > api.log 2>&1 &

      - name: Gerar build e iniciar o client (porta 3000)
        working-directory: client
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:8080
        run: |
          npm run build
          nohup npm start > client.log 2>&1 &

      - name: Aguardar API e client responderem
        run: |
          npx --yes wait-on@8.0.3 --timeout 180000 \
            http-get://localhost:8080/posts?limit=1 \
            http-get://localhost:3000

      # ---------- Execução dos testes ----------
      - name: Executar testes Playwright (API + E2E)
        working-directory: tests
        run: npx playwright test

      - name: Publicar relatório do Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: tests/playwright-report/

      - name: Logs da API e do client (em caso de falha)
        if: failure()
        run: |
          echo "===== API ====="; cat api/api.log || true
          echo "===== CLIENT ====="; cat client/client.log || true
